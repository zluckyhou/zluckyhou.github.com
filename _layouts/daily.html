---
layout: post
---

<aside class="daily-issue-summary" aria-label="日报概览">
    <div>
        <strong>{{ page.issue_count | default: "—" }}</strong>
        <span>今日主线</span>
    </div>
    <div>
        <strong>{{ page.deep_dive_count | default: "—" }}</strong>
        <span>Deep Dives</span>
    </div>
    {% if page.reading_time %}
    <div>
        <strong>{{ page.reading_time }}</strong>
        <span>分钟阅读</span>
    </div>
    {% endif %}
</aside>

<div class="daily-post-content">
    {{ content }}
</div>

<script>
/* Collapse per-item source-link lists ("查看 @xx 原始推文" bullets)
   into compact source chips. Runs on all daily posts, old and new. */
document.addEventListener('DOMContentLoaded', function () {
    var content = document.querySelector('.daily-post-content');
    if (!content) return;

    var isSourceLink = function (a, text) {
        return /(x|twitter)\.com\//i.test(a.href) || /原始推文|原文链接|来源链接/.test(text);
    };

    content.querySelectorAll('ul').forEach(function (ul) {
        var items = Array.prototype.slice.call(ul.children).filter(function (el) {
            return el.tagName === 'LI';
        });
        if (!items.length) return;

        var links = [];
        var allSourceLinks = items.every(function (li) {
            var anchors = li.querySelectorAll('a');
            if (anchors.length !== 1) return false;
            var a = anchors[0];
            var text = (li.textContent || '').trim();
            /* the li must be essentially just the link */
            if (text.replace(/\s+/g, '') !== (a.textContent || '').replace(/\s+/g, '')) return false;
            if (!isSourceLink(a, text)) return false;
            links.push(a);
            return true;
        });
        if (!allSourceLinks || !links.length) return;

        /* Group links by label: @handle for X links, hostname otherwise */
        var groups = [];
        var byLabel = {};
        links.forEach(function (a) {
            var label = null;
            var m = (a.textContent || '').match(/@[A-Za-z0-9_]+/);
            if (m) label = m[0];
            if (!label) {
                var pm = a.pathname ? a.pathname.match(/^\/([A-Za-z0-9_]+)\/status/) : null;
                if (pm && /(x|twitter)\.com$/i.test(a.hostname)) label = '@' + pm[1];
            }
            if (!label) label = (a.hostname || '').replace(/^www\./, '') || '来源';
            if (!byLabel[label]) {
                byLabel[label] = { label: label, isX: /(x|twitter)\.com$/i.test(a.hostname || ''), hrefs: [] };
                groups.push(byLabel[label]);
            }
            byLabel[label].hrefs.push(a.href);
        });

        var wrap = document.createElement('div');
        wrap.className = 'daily-sources';
        var tag = document.createElement('span');
        tag.className = 'daily-sources__label';
        tag.textContent = '来源';
        wrap.appendChild(tag);

        groups.forEach(function (g) {
            var iconHTML = g.isX
                ? '<span class="source-chip__icon" aria-hidden="true">𝕏</span>'
                : '<span class="source-chip__icon" aria-hidden="true">↗</span>';
            if (g.hrefs.length === 1) {
                var a = document.createElement('a');
                a.className = 'source-chip';
                a.href = g.hrefs[0];
                a.target = '_blank';
                a.rel = 'noopener';
                a.innerHTML = iconHTML + g.label;
                wrap.appendChild(a);
            } else {
                var span = document.createElement('span');
                span.className = 'source-chip source-chip--group';
                span.innerHTML = iconHTML + g.label;
                var nums = document.createElement('span');
                nums.className = 'source-chip__links';
                g.hrefs.forEach(function (href, i) {
                    var n = document.createElement('a');
                    n.href = href;
                    n.target = '_blank';
                    n.rel = 'noopener';
                    n.textContent = i + 1;
                    n.setAttribute('aria-label', g.label + ' 原文 ' + (i + 1));
                    nums.appendChild(n);
                });
                span.appendChild(nums);
                wrap.appendChild(span);
            }
        });

        ul.parentNode.replaceChild(wrap, ul);
    });
});
</script>
