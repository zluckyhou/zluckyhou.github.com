---
layout: default
---

<header class="editorial-page-header">
    <div class="editorial-shell">
        {% if page.kicker %}<p class="editorial-section-label">{{ page.kicker }}</p>{% endif %}
        <h1>{{ page.title }}</h1>
        {% if page.description %}<p>{{ page.description }}</p>{% endif %}
    </div>
</header>

<main class="editorial-page-content">
    <div class="editorial-shell">
        {{ content }}
    </div>
</main>
