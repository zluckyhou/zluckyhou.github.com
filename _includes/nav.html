<nav class="editorial-nav" aria-label="主导航">
    <div class="editorial-shell editorial-nav__inner">
        <a class="editorial-wordmark" href="{{ site.baseurl }}/" aria-label="Freedom Hunter 首页">
            <span aria-hidden="true">FH</span>
            Freedom Hunter
        </a>

        <button class="editorial-nav__toggle" type="button" aria-expanded="false" aria-controls="editorial-nav-links">
            <span class="sr-only">展开导航</span>
            <i></i><i></i>
        </button>

        <div class="editorial-nav__links" id="editorial-nav-links">
            <a href="{{ site.baseurl }}/"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a>
            <a class="editorial-nav__highlight" href="{{ site.baseurl }}/highlights/"{% if page.url contains '/highlights' %} aria-current="page"{% endif %}>读者精选</a>
            <a href="{{ site.baseurl }}/ai-daily/"{% if page.url contains '/ai-daily' or page.categories contains 'ai-daily' %} aria-current="page"{% endif %}>AI 日报</a>
            <a href="{{ site.baseurl }}/reddit-daily/"{% if page.url contains '/reddit-daily' or page.categories contains 'reddit' %} aria-current="page"{% endif %}>Reddit 精选</a>
            <a href="{{ site.baseurl }}/company-research/"{% if page.url contains '/company-research' or page.categories contains 'company-research' %} aria-current="page"{% endif %}>公司观察</a>
            <a href="{{ site.baseurl }}/articles/"{% if page.url contains '/articles' or page.categories contains 'ideas' %} aria-current="page"{% endif %}>文章</a>
            <a href="{{ site.baseurl }}/about/"{% if page.url contains '/about' %} aria-current="page"{% endif %}>关于作者</a>
        </div>

    </div>
</nav>

<script>
document.addEventListener('DOMContentLoaded', function () {
    var toggle = document.querySelector('.editorial-nav__toggle');
    var links = document.querySelector('.editorial-nav__links');
    if (!toggle || !links) return;

    toggle.addEventListener('click', function () {
        var isOpen = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', String(!isOpen));
        links.classList.toggle('is-open', !isOpen);
    });
});
</script>
