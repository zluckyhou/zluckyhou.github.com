name: Initialize Gitalk comments

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  gitalk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _published_site

      - name: Initialize missing comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/initialize_gitalk.mjs --site-dir _published_site
