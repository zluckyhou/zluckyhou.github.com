<!-- Footer -->
<footer class="editorial-footer">
    <div class="editorial-shell editorial-footer__inner">
        <div class="editorial-footer__brand">
            <a class="editorial-wordmark editorial-wordmark--footer" href="{{ site.baseurl }}/" aria-label="Freedom Hunter 首页">
                <span aria-hidden="true">FH</span>
                Freedom Hunter
            </a>
            <p>追踪正在发生的，留下值得重读的。</p>
        </div>

        <nav class="editorial-footer__nav" aria-label="页脚导航">
            <div>
                <p>栏目</p>
                <a href="{{ site.baseurl }}/ai-daily/">AI 日报</a>
                <a href="{{ site.baseurl }}/reddit-daily/">Reddit 精选</a>
                <a href="{{ site.baseurl }}/company-research/">公司观察</a>
                <a href="{{ site.baseurl }}/articles/">文章</a>
            </div>
            <div>
                <p>更多</p>
                <a href="{{ site.baseurl }}/archive/">全部文章</a>
                <a href="{{ site.baseurl }}/highlights/">读者精选</a>
                <a href="{{ site.baseurl }}/about/">关于作者</a>
                <a href="{{ "/feed.xml" | prepend: site.baseurl }}">RSS 订阅</a>
                {% if site.github_username %}<a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub ↗</a>{% endif %}
            </div>
        </nav>
    </div>

    <div class="editorial-footer__meta">
        <div class="editorial-shell editorial-footer__meta-inner">
            <span>&copy; {{ site.time | date: '%Y' }} Freedom Hunter</span>
            <span>Shanghai · UTC+8 · Powered by Jekyll</span>
        </div>
    </div>
</footer>

<!-- jQuery -->
<script src="{{ "/js/jquery.min.js " | prepend: site.baseurl }}"></script>

<!-- Bootstrap Core JavaScript -->
<script src="{{ "/js/bootstrap.min.js " | prepend: site.baseurl }}"></script>

<!-- Custom Theme JavaScript -->
<script src="{{ "/js/clean-blog.min.js " | prepend: site.baseurl }}"></script>



<!-- Highlight.js -->
<script src="https://cdn.bootcss.com/highlight.js/8.6/highlight.min.js"></script>
<script>
    if (window.hljs) {
        hljs.initHighlightingOnLoad();
    }
</script>
<link href="https://cdn.bootcss.com/highlight.js/8.6/styles/github.min.css" rel="stylesheet">
