# Site settings
title: Freedom Hunter
header-img: "img/dark_yellow_400.png"
tagline: "zluckyH"  
description: "追踪正在发生的，留下值得重读的。AI 前沿日报、公司财报观察、Reddit 社区精选与个人思考，每天筛选值得保存的内容。"
keywords: "AI 日报, AI Frontier Daily, Reddit 精选, 公司观察, 财报分析, 产品经理, 数据产品, AI 应用, 产品设计, 科技博客"
baseurl: ""
url: "https://zluckyhou.github.io"

# About/contact
owner: 
  name: " zluckyH"
  email: zluckyhou@163.com
  bio: "Stay Hungry, Stay Foolish! "

# Data
gavatar: http://dreamofbook.qiniudn.com/Az..png
favicon: img/favicon.ico

douban_username: 
twitter_username: John43497285
github_username: zluckyhou
facebook_username: 
#weibo_username:  
zhihu_username: 

# Build settings  
# use Github Flavored Markdown !important  
# document: http://jekyllrb.com/docs/configuration/#kramdown  
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/
paginate: 8
exclude: ["less","node_modules","Gruntfile.js","package.json","README.md","firebase.json",".firebaserc","firestore.rules","firestore.indexes.json","firebase-debug.log"]

# http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone: Asia/Shanghai

# Defaults for posts
defaults:
  -
    scope: 
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "zluckyH"
      header-img: "img/light_blue_banner.png" # We don't want posts without a header image, that whould mean white on white
      sitemap: true


# Analytics and webmaster tools stuff goes here
google_analytics: 
google_verify:
# https://ssl.bing.com/webmaster/configure/verify/ownership Option 2 content= goes here
bing_verify:

# Links to include in footer navigation

# url: "https://zluckyhou.github.io/" # the base hostname & protocol for your site
plugins:
  - jekyll-sitemap
  - jekyll-paginate
